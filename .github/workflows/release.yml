name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v[0-9]+.*

jobs:
  # `vale-ls --version` reports the version in Cargo.toml, so a tag that
  # doesn't match it ships a binary that lies about which release it is.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Compare the tag with Cargo.toml
        run: |
          # `--locked` (without `--no-deps`, which skips resolution) also
          # fails if Cargo.lock wasn't updated alongside the bump.
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --locked --format-version=1 | jq -r '.packages[] | select(.name == "vale-ls") | .version')"

          if [ "$tag" != "$crate" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' doesn't match Cargo.toml version '$crate'; bump the crate (and commit Cargo.lock) before tagging"
            exit 1
          fi

          echo "tag '$GITHUB_REF_NAME' matches Cargo.toml version '$crate'"

  create-release:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: taiki-e/create-gh-release-action@v1
        with:
          # (required) GitHub token for creating GitHub Releases.
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: verify-version
    strategy:
      matrix:
        include:
          # The Linux binaries are built against glibc 2.17 so that they run on
          # distributions older than the runner. Building them natively links
          # against the runner's glibc, which leaves anything older -- Ubuntu
          # 22.04, for one -- unable to start the binary at all.
          #
          # cargo-zigbuild reads the `.2.17` suffix; the archive is still named
          # for the plain target triple.
          - target: aarch64-unknown-linux-gnu.2.17
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          - target: aarch64-apple-darwin
            os: macos-latest
            build-tool: cargo
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            build-tool: cargo
          - target: x86_64-unknown-linux-gnu.2.17
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          - target: x86_64-apple-darwin
            os: macos-latest
            build-tool: cargo
          - target: x86_64-pc-windows-gnu
            os: windows-latest
            build-tool: cargo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          # (required) Comma-separated list of binary names (non-extension portion of filename) to build and upload.
          # Note that glob pattern is not supported yet.
          bin: vale-ls
          # (optional) Target triple, default is host triple.
          target: ${{ matrix.target }}
          # (optional) Tool to build binaries (cargo, cross, or cargo-zigbuild).
          build-tool: ${{ matrix.build-tool }}
          # (required) GitHub token for uploading assets to GitHub Releases.
          token: ${{ secrets.GITHUB_TOKEN }}
          zip: all
          tar: none
